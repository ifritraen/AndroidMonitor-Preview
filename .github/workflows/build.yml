name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-monitor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-monitor-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AndroidMonitor_v0_2_0.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AndroidMonitor_v0_2_0_r3.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AndroidMonitor_v0_2_0_debug.apk
      - name: Attach APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          files: |
            app/build/outputs/apk/release/AndroidMonitor_v0_2_0.apk
            app/build/outputs/apk/release/AndroidMonitor_v0_2_0_r3.apk
            app/build/outputs/apk/debug/AndroidMonitor_v0_2_0_debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

